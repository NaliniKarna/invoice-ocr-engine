[project]
name = "bill-ocr-api"
version = "0.3.0"
description = "Multi-tenant Bill/Invoice OCR and document-understanding API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration_pg: requires a real PostgreSQL (OCR_TEST_DATABASE_URL)", "integration_redis: requires a real Redis (OCR_TEST_REDIS_URL)"]
